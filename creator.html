<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Creators — 1World Web</title>
    <meta name="description" content="Find content creators and walk into the studio, blog, space, library, gallery, server or cinema they run — or manage your own from the studio." />
    <meta name="theme-color" content="#060607" />
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/base.css?v=20261105c" />
    <link rel="stylesheet" href="assets/css/layout.css?v=20261105c" />
    <link rel="stylesheet" href="assets/css/components.css?v=20261105c" />
    <link rel="stylesheet" href="assets/css/dashboard.css?v=20261105c" />
    <link rel="stylesheet" href="assets/css/creator.css?v=20261105c" />
    <script>
      /* apply the saved theme (or the OS preference) before first paint */
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem("1w.theme") || "null");
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "light" ? "#f4f4f5" : "#060607");
        } catch (e) {}
      })();
    </script>
    <script type="module" src="assets/js/app.js?v=20261105c"></script>
    <script type="module" src="assets/js/creator.js?v=20261105c"></script>
  </head>
  <body data-page="creator" data-title="Creators" class="cr-body">
    <a class="skip-link" href="#main">Skip to content</a>

    <div data-site-header></div>
    <div data-site-sidebar></div>

    <main class="site-main cr" id="main">
      <!-- loading / error / sign-in --------------------------------- -->
      <div class="cr-state" data-cr-state>
        <div class="cr-skeleton" aria-hidden="true"></div>
      </div>

      <div class="cr-shell" data-cr-shell hidden>
        <!-- ============================================================ -->
        <!-- the member, and the five things they run                     -->
        <!-- ============================================================ -->
        <aside class="cr-side" aria-label="Creator sections">
          <div class="cr-me">
            <span class="cr-me__avatar" data-cr-avatar>
              <img data-cr-avatar-img alt="" width="56" height="56" hidden />
              <span data-cr-avatar-initial aria-hidden="true">1W</span>
            </span>
            <div class="cr-me__id">
              <p class="cr-me__name" data-cr-name>—</p>
              <p class="cr-me__handle" data-cr-username>@—</p>
              <p class="cr-me__code" data-cr-code hidden></p>
            </div>
          </div>

          <nav class="cr-sections cr-sections--discover" data-cr-discover aria-label="Discover"></nav>

          <nav class="cr-sections" data-cr-sections aria-label="Studio sections"></nav>

          <div class="cr-side__foot" data-cr-side-foot>
            <a class="cr-side__link" href="profile.html"><i data-icon="user"></i> Your profile</a>
            <a class="cr-side__link" href="dashboard.html"><i data-icon="dashboard"></i> Dashboard</a>
          </div>
        </aside>

        <!-- ============================================================ -->
        <!-- the studio                                                   -->
        <!-- ============================================================ -->
        <section class="cr-main">
          <header class="cr-top" data-cr-top>
            <div class="cr-pick">
              <span class="cr-pick__label">Managing</span>
              <div class="cr-pick__row">
                <select class="dsh-select cr-pick__select" data-cr-hub aria-label="Select the studio, blog, space, library or gallery"></select>
                <button class="dsh-btn dsh-btn--sm" type="button" data-cr-new-hub><i data-icon="plus"></i> Add</button>
              </div>
              <p class="cr-pick__hint" data-cr-hub-hint></p>
            </div>

            <div class="cr-add">
              <button class="dsh-btn dsh-btn--primary dsh-btn--sm" type="button" data-cr-add-toggle aria-expanded="false" aria-controls="crAddMenu">
                <i data-icon="plus"></i> Add content
              </button>
              <div class="cr-drop" id="crAddMenu" data-cr-add-menu hidden></div>
            </div>
          </header>

          <div class="cr-hubhead" data-cr-hubhead hidden></div>

          <nav class="cr-tabs" data-cr-tabs aria-label="Tabs"></nav>

          <div class="cr-view" data-cr-view aria-live="polite"></div>
        </section>
      </div>
    </main>

    <div data-site-footer></div>
  </body>
</html>
