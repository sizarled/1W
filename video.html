<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Video — 1World Web</title>
    <meta name="description" content="One member video — moved to the videos page." />
    <meta name="theme-color" content="#060607" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/base.css?v=20261116a" />
    <link rel="stylesheet" href="assets/css/layout.css?v=20261116a" />
    <link rel="stylesheet" href="assets/css/components.css?v=20261215a" />
    <link rel="stylesheet" href="assets/css/video.css?v=20261118b" />
    <script>
      /* apply the saved theme (or the OS preference) before first paint */
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem("1w.theme") || "null");
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "light" ? "#f4f4f5" : "#060607");
        } catch (e) {}
      })();
    </script>
    <script type="module" src="assets/js/app.js?v=20261216a"></script>
    <script>
      /* video.html?id=PST-001005 → videos.html#/v/PST-001005
         (watch.html and cast.html still link here; the old address keeps working) */
      (function () {
        var id = new URLSearchParams(location.search).get("id") || "";
        var target = id ? "videos.html#/v/" + encodeURIComponent(id) : "videos.html";
        location.replace(target);
      })();
    </script>
  </head>
  <body data-page="video" data-title="Video">
    <a class="skip-link" href="#main">Skip to content</a>
    <div data-site-header></div>
    <div data-site-sidebar></div>

    <main class="site-main vids" id="main">
      <div class="wrap">
        <header class="vids__head">
        <div class="vids__intro">
          <p class="eyebrow"><span class="eyebrow__dot"></span>Member videos</p>
          <h1 class="vids__title">This video moved</h1>
          <p class="vids__sub">
            Every member video now lives on one page — the feed and the player together. You are being taken
            there.
          </p>
          <p class="vids__acts" style="margin-top: 1.2rem">
            <a class="btn btn--primary" href="videos.html"><i data-icon="play"></i> Open the videos page</a>
          </p>
        </div>
        </header>
      </div>
    </main>

    <div data-site-footer></div>
  </body>
</html>
