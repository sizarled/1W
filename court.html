<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Court — 1World Web</title>
    <meta name="description" content="Your trial: case number, date, parties, verdict." />
    <meta name="theme-color" content="#060607" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- the API is the first thing every page asks for; `crossorigin` is what
         makes the socket usable by the CORS fetch that follows -->
    <link rel="preconnect" href="https://vtbqbhuywdhnvitbcsfy.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://image.tmdb.org" />
    <link rel="dns-prefetch" href="https://thumb.tapecontent.net" />
    <!-- One variable Inter covers every weight the design uses — the named
         ones (400/500/600/700/800) and the half steps the type scale asks for
         (540, 550, 570, 650, 750) — so the page downloads one font file
         instead of six, and the stylesheet arrives after the first paint
         rather than holding it up. The system stack draws the words in
         between, which is what `display=swap` was always going to do. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=Instrument+Serif:ital@0;1&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=Instrument+Serif:ital@0;1&display=swap"
      />
    </noscript>
    <link rel="stylesheet" href="assets/css/base.css?v=20261116a" />
    <link rel="stylesheet" href="assets/css/layout.css?v=20261116a" />
    <link rel="stylesheet" href="assets/css/components.css?v=20261217a" />
    <link rel="stylesheet" href="assets/css/dashboard.css?v=20261116j" />
    <script>
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem("1w.theme") || "null");
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
    <script type="module" src="assets/js/app.js?v=20261217a"></script>
    <script type="module" src="assets/js/court.js?v=20261101k"></script>
  </head>

  <body data-page="court" data-title="Court">
    <a class="skip-link" href="#main">Skip to content</a>

    <div class="dsh-page">
      <header class="dsh-simple-top">
        <a class="dsh-brand" href="index.html">
          <span class="dsh-brand__mark" aria-hidden="true">1W</span>
          <span class="dsh-brand__name">Court</span>
        </a>
        <div class="dsh-top__tools">
          <a class="dsh-btn dsh-btn--sm" href="dashboard.html#court"><i data-icon="arrowLeft"></i>Dashboard</a>
          <button class="dsh-icon-btn" type="button" data-logout aria-label="Log out"><i data-icon="logout"></i></button>
        </div>
      </header>

      <main id="main" class="dsh-page__main">
        <p class="dsh-crumbs">
          <a href="dashboard.html">Dashboard</a> <span aria-hidden="true">/</span>
          <a href="dashboard.html#court">Court</a> <span aria-hidden="true">/</span>
          <span data-court-code>Case</span>
        </p>

        <div data-court-room>
          <div class="dsh-loading"><span class="dsh-spinner" aria-hidden="true"></span><p>Opening the case file…</p></div>
        </div>
      </main>
    </div>
  </body>
</html>
